name: geospatial-vision-observatory
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: geospatial-vision-observatory:baseline
    env_file: .env
    environment:
      VISION_BIND_HOST: 0.0.0.0
      VISION_BIND_PORT: 8080
      VISION_DATA_DIR: /data
      VISION_DB_PATH: /data/geospatial.db
      VISION_MODEL_DIR: /models
      VISION_REPORTS_DIR: /reports
    volumes:
      - vision-data:/data
      - ./models:/models:ro
      - ./reports:/reports:ro
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    image: geospatial-vision-observatory:baseline
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      VISION_BIND_HOST: 0.0.0.0
      VISION_BIND_PORT: 8080
      VISION_DATA_DIR: /data
      VISION_DB_PATH: /data/geospatial.db
      VISION_MODEL_DIR: /models
      VISION_REPORTS_DIR: /reports
    entrypoint: ["geospatial-vision-worker"]
    volumes:
      - vision-data:/data
      - ./models:/models:ro
      - ./reports:/reports:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  vision-data:
